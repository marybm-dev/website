<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">VOFocus architecture</title>
<desc id="svg-desc">On the Mac: an AI agent talks to the vofocus-mcp server, and you or CI use the vofocus CLI. Both use VOFocusKit, whose RunnerManager starts the runner once through xcodebuild and whose RunnerClient sends HTTP commands such as POST /vo/next, with a token, over loopback to a Simulator or over the CoreDevice tunnel to an iPhone (USB or Wi-Fi). On the iPhone or Simulator, the VOFocusRunner UI test runs each command with XCUIVoiceOverService and synthesized swipes, driving the real VoiceOver, which reads your unchanged app and speaks; the runner replies with what it said, such as Save Button. Optionally, VOFocusAudio (experimental) records VoiceOver's speech and sounds, never a microphone, and transcribes them on the Mac.</desc>
<style>
.bg{fill:#f6f7f9} .zone-mac{fill:#e8eef8} .zone-dev{fill:#eaf4ef}
.box{fill:#ffffff;stroke:#c9d0da;stroke-width:1.25}
.box-kit{fill:none;stroke:#2856c9;stroke-width:1.25;stroke-dasharray:4 4}
.box-run{fill:#ffffff;stroke:#1f7a52;stroke-width:2}
.box-mcp{fill:#ffffff;stroke:#2856c9;stroke-width:2}
.box-aud{fill:#f6effc;stroke:#8a4fbf;stroke-width:1.5;stroke-dasharray:6 3}
.ring{fill:none;stroke:#111111;stroke-width:3} .chip{fill:#eceff4}
.t-zone{font:600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#5b6676}
.t-title{font:600 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#16202e} .t-sub{font:400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#5b6676}
.t-mono{font:500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#16202e} .t-edge{font:400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#5b6676}
.t-acc{fill:#2856c9} .t-dev{fill:#1f7a52} .t-aud{fill:#8a4fbf}
.edge{stroke:#5b6676;stroke-width:1.5;fill:none} .edge-acc{stroke:#2856c9;stroke-width:2;fill:none}
.edge-dev{stroke:#1f7a52;stroke-width:2;fill:none} .edge-aud{stroke:#8a4fbf;stroke-width:2;fill:none;stroke-dasharray:2 4;stroke-linecap:round}
.dashed{stroke-dasharray:5 4}
.head{fill:#5b6676} .head-acc{fill:#2856c9} .head-dev{fill:#1f7a52} .head-aud{fill:#8a4fbf}
</style>
<rect class="bg" width="960" height="640" rx="14"/>
<defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-acc" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-dev" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="hu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-aud" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="zone-mac" x="10" y="10" width="440" height="620" rx="16"/>
<rect class="zone-dev" x="590" y="10" width="360" height="620" rx="16"/>
<text class="t-zone" x="30" y="40">YOUR MAC</text>
<text class="t-zone" x="610" y="40">IPHONE OR SIMULATOR</text>
<rect class="box" x="30" y="60" width="195" height="58" rx="10"/>
<text class="t-title" x="46" y="85">AI agent</text>
<text class="t-sub" x="46" y="104">Claude Code, any MCP client</text>
<rect class="box" x="240" y="60" width="195" height="58" rx="10"/>
<text class="t-title" x="256" y="85">You or CI</text>
<text class="t-sub" x="256" y="104">a terminal, GitHub Actions</text>
<path class="edge" d="M127,118 L127,162" marker-end="url(#h)"/>
<text class="t-edge" x="135" y="145">tool calls</text>
<path class="edge" d="M337,118 L337,162" marker-end="url(#h)"/>
<text class="t-edge" x="345" y="145">vofocus run</text>
<rect class="box-mcp" x="30" y="165" width="195" height="78" rx="10"/>
<text class="t-title t-acc" x="46" y="190">vofocus-mcp</text>
<text class="t-sub" x="46" y="209">MCP server: 16 tools, like</text>
<text class="t-sub" x="46" y="225">vo_walk and audio_report</text>
<rect class="box" x="240" y="165" width="195" height="78" rx="10"/>
<text class="t-title" x="256" y="190">vofocus CLI</text>
<text class="t-sub" x="256" y="209">runs and records YAML</text>
<text class="t-sub" x="256" y="225">scenarios, writes JUnit</text>
<path class="edge" d="M127,243 L127,282" marker-end="url(#h)"/>
<path class="edge" d="M337,243 L337,282" marker-end="url(#h)"/>
<rect class="box-kit" x="30" y="285" width="405" height="135" rx="12"/>
<text class="t-mono t-acc" x="46" y="308">VOFocusKit (shared Swift library)</text>
<rect class="box" x="46" y="322" width="180" height="82" rx="10"/>
<text class="t-title" x="62" y="348">RunnerManager</text>
<text class="t-sub" x="62" y="368">starts and stops</text>
<text class="t-sub" x="62" y="385">the runner</text>
<rect class="box" x="240" y="322" width="180" height="82" rx="10"/>
<text class="t-title" x="256" y="348">RunnerClient</text>
<text class="t-sub" x="256" y="368">sends commands with</text>
<text class="t-sub" x="256" y="385">the token, reads replies</text>
<path class="edge" d="M136,404 L136,452" marker-end="url(#h)"/>
<rect class="box" x="46" y="455" width="180" height="44" rx="10"/>
<text class="t-mono" x="62" y="482">xcodebuild test</text>
<rect class="box-aud" x="30" y="520" width="405" height="96" rx="12"/>
<text class="t-mono t-aud" x="46" y="545">VOFocusAudio · experimental, opt-in</text>
<text class="t-sub" x="46" y="568">records VoiceOver's speech and sounds, never a mic;</text>
<text class="t-sub" x="46" y="585">transcribes on the Mac and lines words and sounds</text>
<text class="t-sub" x="46" y="602">up with each step (run --audio, audio_start)</text>
<rect class="box" x="615" y="60" width="310" height="112" rx="10"/>
<text class="t-title" x="633" y="86">Your app</text>
<text class="t-sub" x="633" y="105">unchanged: nothing added to it</text>
<rect class="chip" x="633" y="120" width="82" height="34" rx="7"/>
<text class="t-mono" x="674" y="142" text-anchor="middle">Profile</text>
<rect class="chip" x="721" y="120" width="82" height="34" rx="7"/>
<text class="t-mono" x="762" y="142" text-anchor="middle">Save</text>
<rect class="chip" x="809" y="120" width="82" height="34" rx="7"/>
<text class="t-mono" x="850" y="142" text-anchor="middle">Cancel</text>
<rect class="ring" x="717" y="116" width="90" height="42" rx="9"/>
<path class="edge" d="M700,214 L700,175" marker-end="url(#h)"/>
<text class="t-edge" x="708" y="192">reads the accessibility tree</text>
<rect class="box" x="615" y="217" width="310" height="72" rx="10"/>
<text class="t-title" x="633" y="243">VoiceOver</text>
<text class="t-sub" x="633" y="262">the real one, built into iOS:</text>
<text class="t-sub" x="633" y="278">it speaks and plays its sounds</text>
<path class="edge-dev" d="M700,340 L700,292" marker-end="url(#hd)"/>
<text class="t-edge" x="708" y="312">move, swipe, tap,</text>
<text class="t-edge" x="708" y="327">read speech</text>
<path class="edge" d="M860,292 L860,340" marker-end="url(#h)"/>
<text class="t-edge" x="868" y="320">speech</text>
<rect class="box-run" x="615" y="343" width="310" height="122" rx="10"/>
<text class="t-title t-dev" x="633" y="369">VOFocusRunner</text>
<text class="t-sub" x="633" y="389">a UI test that never finishes: it waits</text>
<text class="t-sub" x="633" y="406">for commands on port 8740 and runs</text>
<text class="t-sub" x="633" y="423">each one with XCUITest</text>
<rect class="chip" x="633" y="433" width="200" height="22" rx="5"/>
<text class="t-mono" x="642" y="449">XCUIVoiceOverService</text>
<text class="t-edge" x="462" y="282">HTTP + token over</text>
<text class="t-edge" x="462" y="298">CoreDevice tunnel</text>
<text class="t-edge" x="462" y="314">(USB or Wi-Fi),</text>
<text class="t-edge" x="462" y="330">or loopback (Sim)</text>
<path class="edge-acc" d="M420,372 L612,372" marker-end="url(#ha)"/>
<text class="t-edge t-acc" x="462" y="365">POST /vo/next</text>
<path class="edge-dev" d="M612,398 L423,398" marker-end="url(#hd)"/>
<text class="t-edge t-dev" x="462" y="416">"Save Button"</text>
<path class="edge dashed" d="M226,477 L770,477 L770,468" marker-end="url(#h)"/>
<text class="t-edge" x="462" y="470">starts it, once</text>
<path class="edge-aud" d="M925,253 L940,253 L940,590 L438,590" marker-end="url(#hu)"/>
<text class="t-edge t-aud" x="615" y="530">VoiceOver's audio: a process</text>
<text class="t-edge t-aud" x="615" y="546">tap on the Simulator, or the</text>
<text class="t-edge t-aud" x="615" y="562">iPhone's audio over USB</text>
</svg>
